openapi: 3.1.0
info:
  title: Shared primitives
  version: 0.1.0
  description: Prefixed IDs and money types shared across domains.
paths: {}
components:
  schemas:
    TenantId:
      type: string
      description: Prefixed ULID-style tenant identifier.
      pattern: '^tnt_[0-9A-HJKMNP-TV-Z]{26}$'
      example: tnt_01HZYXK8J0M0W5N6P7Q8R9S0T1U2
    UserId:
      type: string
      description: Prefixed ULID-style tenant operator user identifier.
      pattern: '^usr_[0-9A-HJKMNP-TV-Z]{26}$'
      example: usr_01HZYXK8J0M0W5N6P7Q8R9S0T1U2
    Currency:
      type: string
      description: ISO 4217 currency code.
      minLength: 3
      maxLength: 3
      pattern: '^[A-Z]{3}$'
      example: USD
    Money:
      type: object
      description: Decimal-string amount + currency (never IEEE float).
      required:
        - amount
        - currency
      properties:
        amount:
          type: string
          description: Signed decimal string with up to 5 fractional digits.
          pattern: '^-?\d+(\.\d{1,5})?$'
          example: "1234.56"
        currency:
          $ref: '#/components/schemas/Currency'
    JobStatus:
      type: string
      description: Generic async job lifecycle.
      enum:
        - queued
        - running
        - done
        - failed
    BuildId:
      type: string
      description: Contract build id (`bld_…`).
      pattern: '^bld_[0-9A-HJKMNP-TV-Z]{26}$'
    FunctionId:
      type: string
      description: Public function id (`fnc_…`).
      pattern: '^fnc_[0-9A-HJKMNP-TV-Z]{26}$'
    BoundId:
      type: string
      description: Gas bound id (`bnd_…`).
      pattern: '^bnd_[0-9A-HJKMNP-TV-Z]{26}$'
    CertificateId:
      type: string
      description: Gas certificate id (`crt_…`).
      pattern: '^crt_[0-9A-HJKMNP-TV-Z]{26}$'
    RecommendationId:
      type: string
      description: Limit recommendation id (`rec_…`).
      pattern: '^rec_[0-9A-HJKMNP-TV-Z]{26}$'
    MonitorId:
      type: string
      description: Assumption monitor id (`mon_…`).
      pattern: '^mon_[0-9A-HJKMNP-TV-Z]{26}$'
    AlertId:
      type: string
      description: Monitor alert id (`alt_…`).
      pattern: '^alt_[0-9A-HJKMNP-TV-Z]{26}$'
    PolicyId:
      type: string
      description: CI policy id (`pol_…`).
      pattern: '^pol_[0-9A-HJKMNP-TV-Z]{26}$'
    GriefingEstimateId:
      type: string
      description: Griefing estimate id (`grf_…`).
      pattern: '^grf_[0-9A-HJKMNP-TV-Z]{26}$'

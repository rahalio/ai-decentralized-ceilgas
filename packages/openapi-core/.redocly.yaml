apis:
  identity:
    root: src/identity.yaml
  builds:
    root: src/builds.yaml
  functions:
    root: src/functions.yaml
  bounds:
    root: src/bounds.yaml
  certificates:
    root: src/certificates.yaml
  recommendations:
    root: src/recommendations.yaml
  monitors:
    root: src/monitors.yaml
  policies:
    root: src/policies.yaml
  griefing:
    root: src/griefing.yaml

extends:
  - recommended

rules:
  no-unused-components: off
  operation-4xx-response: warn
  info-license: off
  info-license-url: off
  tag-description: off
  operation-operationId: error
  no-invalid-media-type-examples: off

theme:
  openapi:
    generateCodeSamples:
      languages: []
